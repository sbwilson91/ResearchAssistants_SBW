name: Monthly Running Summary

on:
  schedule:
    - cron: "0 8 1 * *"   # 1st of every month at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monthly-summary:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate monthly summary
        env:
          PYTHONPATH:           running_bot
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          GARMIN_EMAIL:         ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD:      ${{ secrets.GARMIN_PASSWORD }}
          EMAIL_SENDER:         ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER:       ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_PASSWORD:       ${{ secrets.EMAIL_PASSWORD }}
        run: python running_bot/monthly_summary.py

      - name: Commit monthly log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add running_bot/monthly_logs/
          git diff --staged --quiet || git commit -m "monthly: $(date +%Y-%m) [skip ci]"
          git pull --rebase --autostash origin main
          git push
