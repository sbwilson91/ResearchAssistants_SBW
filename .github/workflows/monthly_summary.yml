name: Monthly Running Summary

on:
  schedule:
    - cron: "0 8 1 * *"   # 1st of every month at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monthly-summary:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate monthly summary
        env:
          PYTHONPATH:           running_bot
          STRAVA_CLIENT_ID:     ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_SENDER:         ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER:       ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_PASSWORD:       ${{ secrets.EMAIL_PASSWORD }}
        run: python running_bot/monthly_summary.py

      - name: Rotate Strava refresh token if needed
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f new_refresh_token.txt ]; then
            gh secret set STRAVA_REFRESH_TOKEN \
              --body "$(cat new_refresh_token.txt)" \
              --repo "${{ github.repository }}"
            rm new_refresh_token.txt
            echo "✓ STRAVA_REFRESH_TOKEN rotated"
          fi

      - name: Commit monthly log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add running_bot/monthly_logs/
          git diff --staged --quiet || git commit -m "monthly: $(date +%Y-%m) [skip ci]"
          git pull --rebase --autostash origin main
          git push
