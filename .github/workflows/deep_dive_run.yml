name: Running Deep Dive (one-off)

# Manual, one-off investigation. Fetches Garmin full history + current
# physiology and commits running_bot/reports/deep_dive_data.json. It does NOT
# call Claude — the synthesis + Artifact are produced separately from the JSON.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deep-dive:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect deep-dive data
        env:
          PYTHONPATH:           running_bot
          GARMIN_EMAIL:         ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD:      ${{ secrets.GARMIN_PASSWORD }}
        run: python running_bot/deep_dive.py

      - name: Commit deep-dive data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add running_bot/reports/deep_dive_data.json
          git diff --staged --quiet || git commit -m "deep-dive: $(date +%Y-%m-%d) [skip ci]"
          git push
